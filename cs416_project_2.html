<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <script src='https://d3js.org/d3.v5.min.js'></script>
    </head>
    <body onload='init()'>
        <script>
            async function init() {
                const data = await d3.csv(
                    "Large Cars Dataset.csv"
                )
                d3.select('body')
                .selectAll('p')
                .data(data)
                .enter()
                .append('p')
                    .html(
                        function(d,i) {
                            return 'item ' + d.MRSP;
                        }
                    );
            }
        </script>
    </body>
</html>
