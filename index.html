<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <script src='https://d3js.org/d3.v6.min.js'></script>
        <style> 
            line {
                fill: none;
                stroke: black;
            }

            #body_type_chart {
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
            }

            #mpg_chart {
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
            }
            
            #user_graphic {
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
            }

            #user_checkboxes {
              display: flex;
              justify-content: center;
              align-items: center;
              width: 100%;
            }
        </style>
    </head>
    <body onload='init()'>

        <div id="mpg_chart"></div>
        <div id="body_type_chart"></div>
        <div id="user_graphic"></div>
        <div id="user_checkboxes">
            <input type="checkbox" class="checkbox" value="mpg_data" checked><label>Yearly Average MPG</label>
            <input type="checkbox" class="checkbox" value="electricity_data" checked><label>Percentage Electric Cars</label>
            <input type="checkbox" class="checkbox" value="model_data" checked><label>Number of Car Models</label>
            <input type="checkbox" class="checkbox" value="greenhouse_data" checked><label>Greenhouse Scores</label>
            <input type="checkbox" class="checkbox" value="average_gas_data" checked><label>Average Gas Price</label>
        </div>
        
        <script>
            async function init() {
                // https://d3js.org/d3.v5.min.js

                // Load Data
                const mpg_data = await d3.csv(
                    "clean_data/average_mpg_by_year.csv"
                )

                const body_type_data = await d3.csv(
                    "clean_data/body_type_proportion_per_year.csv"
                )

                const percent_electric_data = await d3.csv(
                    "clean_data/percent_electric.csv"
                )

                const count_models_data = await d3.csv(
                    "clean_data/count_models.csv"
                )

                const greenhouse_score_data = await d3.csv(
                    "clean_data/greenhouse_score.csv"
                )

                const average_gas_price_data = await d3.csv( // https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=pet&s=emm_epm0_pte_nus_dpg&f=a
                    "clean_data/yearly_average_gas_price.csv"
                )

                const width = 200;
                const height = 200;
                const margin = 50;

                // MPG Graph

                const xScale = d3.scaleLinear().domain([2000,2025]).range([0, width]);
                const yScale = d3.scaleLinear().domain([0, 45]).range([height, 0]);

                const mpg_graph = d3.select('#mpg_chart')
                    .append('svg')
                    .attr("width", width + margin * 2)
                    .attr("height", height + margin * 2);

                console.log("3. Initial mpg chart");

                const lineGenerator = d3.line()
                    .x(d => xScale(d.Year))
                    .y(d => yScale(d.Mean_Cmb_MPG));

                mpg_graph.append("path")
                    .datum(mpg_data) 
                    .attr("fill", "none")
                    .attr("stroke", "currentColor")
                    .attr("stroke-width", 1.5)
                    .attr("transform", "translate("+margin+","+margin+")")
                    .attr("d", lineGenerator);

                console.log("4. Initial mpg chart");

                mpg_graph.append('g')
                    .attr("transform", "translate(" + margin + "," + margin + ")")
                    .call(d3.axisLeft(yScale));

                mpg_graph.append('g')
                    .attr("transform", "translate(" + margin + "," + (height + margin) + ")")
                    .call(d3.axisBottom(xScale))
                    .selectAll("text")
                    .attr("transform", "rotate(-45)")
                    .style("text-anchor", "end");

                // Stacked Barchart Graph

                const body_graph = d3.select('#body_type_chart')
                    .append('svg')
                    .attr("width", width + margin * 2)
                    .attr("height", height + margin * 2);

                const groupedData = d3.group(
                    body_type_data,
                    d => +d.Year,
                    d => d.veh_class
                );
                
                const series = d3.stack() // https://d3js.org/d3-shape/stack
                    .keys(d3.union(body_type_data.map(d => d.veh_class)))
                    .value(([year, group], key) => group.get(key)?.[0]?.proportion || 0)
                    .order(d3.stackOrderAscending)
                    (groupedData);

                console.log("5. series initiated")

                const color = d3.scaleOrdinal()
                    .domain(series.map(d => d.key))
                    .range(d3.schemeTableau10)

                const x = d3.scaleBand().domain(
                    [2000, 2001, 2002, 2003, 2004,
                     2005, 2006, 2007, 2008, 2009,
                     2010, 2011, 2012, 2013, 2014,
                     2015, 2016, 2017, 2018, 2019,
                     2020, 2021, 2022, 2023, 2024,
                     2025]).range([0, width]);
                const y = d3.scaleLinear().domain([0, 1]).range([height, 0]);

                body_graph.append("g")
                    .selectAll("g")
                    .data(series)
                    .join("g")
                        .attr("fill", d => color(d.key))
                    .selectAll("rect")
                    .data(D => D)
                    .join("rect")
                        .attr("x", d => x(+d.data[0]))
                        .attr("y", d => y(d[1]))
                        .attr("height", d => y(d[0]) - y(d[1]))
                        .attr("width", x.bandwidth());

                console.log("6. Second graph initialized")

                // User Interface Graphic https://d3-graph-gallery.com/graph/bubblemap_buttonControl.html

                const user_interface_data = [
                    {
                        id: "mpg_data",
                        name: "Average MPG",
                        values: mpg_data.map(d => ({
                          year: +d.Year,
                          val: +d.Mean_Cmb_MPG
                        }))
                    },
                    {
                        id: "electricity_data",
                        name: "Percent of Electric Vehicles",
                        values: percent_electric_data.map(d => ({
                          year: +d.Year,
                          val: +d.percent_electric
                        }))
                    },
                    {
                        id: "model_data",
                        name: "Count Model Type",
                        values: count_models_data.map(d => ({
                          year: +d.Year,
                          val: +d.count_models
                        }))
                    },
                    {
                        id: "greenhouse_data",
                        name: "Greenhouse Score",
                        values: greenhouse_score_data.map(d => ({
                          year: +d.Year,
                          val: +d.greenhouse_score
                        }))
                    },
                    {
                        id: "average_gas_data",
                        name: "Average Gas Price",
                        values: average_gas_price_data.map(d => ({
                          year: +d.Year,
                          val: +d.Average_Gas_Price
                        }))
                    },
                ]
                

                const user_interface_graph = d3.select('#user_graphic')
                    .append('svg')
                    .attr("width", width + margin * 2)
                    .attr("height", height + margin * 2);

                //Reusing xScale
                const user_line = d3.line()
                    .x(d => x(d.year))
                    .y(d => y(d.val));

                const user_color = d3.scaleOrdinal()
                    .domain(["mpg_data", "electricity_data", "model_data", "greenhouse_data", "average_gas_data"])
                    .range(["#A559AA", "#59A89C", "#F0C571", "#E02B35", "#082A54"]);

                user_interface_graph.selectAll(".user-line")
                    .data(user_interface_data)
                    .join("path")
                        .attr("class", d => `user-line ${d.id}`)
                        .attr("fill", "none")
                        .attr("stroke-width", 2)
                        .attr("stroke", d => user_color(d.id))
                        .attr("d", d => user_line(d.values))
                        .style("opacity", 0);

                user_interface_graph.append('g')
                    .attr("transform", "translate(" + margin + "," + (height + margin) + ")")
                    .call(d3.axisBottom(xScale))
                    .selectAll("text")
                    .attr("transform", "rotate(-45)")
                    .style("text-anchor", "end");

                function update(){
            
                  // For each check box:
                  d3.selectAll(".checkbox").each(function(d){
                    const cb = d3.select(this);
                    const grp = cb.property("value");
            
                    // If the box is check, I show the group
                    if(cb.property("checked")){
                      user_interface_graph.selectAll("."+grp).transition().duration(1000).style("opacity", 1);
                    // Otherwise I hide it
                    }else{
                      user_interface_graph.selectAll("."+grp).transition().duration(1000).style("opacity", 0);
                    }
                  })
                }

                d3.selectAll(".checkbox").on("change",update);
            
                update();

            }
        </script>
    </body>
</html>
