<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <script src='https://d3js.org/d3.v6.min.js'></script>
        <style> 
            line {
                fill: none;
                stroke: black;
            }
        </style>
    </head>
    <body onload='init()'>

        <div id="mpg_chart"></div>
        <div id="body_type_chart"></div>
        
        <script>
            async function init() {
                // https://d3js.org/d3.v5.min.js

                // Load Data
                const mpg_data = await d3.csv(
                    "clean_data/average_mpg_by_year.csv"
                )

                const body_type_data = await d3.csv(
                    "clean_data/body_type_proportion_per_year.csv"
                )

                const width = 200;
                const height = 200;
                const margin = 50;

                // MPG Graph

                const xScale = d3.scaleLinear().domain([2000, 2025]).range([0, width]);
                const yScale = d3.scaleLinear().domain([0, 45]).range([height, 0]);

                const mpg_graph = d3.select('#mpg_chart')
                    .append('svg')
                    .attr("width", width + margin * 2)
                    .attr("height", height + margin * 2);

                console.log("3. Initial mpg chart");

                const lineGenerator = d3.line()
                    .x(d => xScale(d.Year))
                    .y(d => yScale(d.Mean_Cmb_MPG));

                mpg_graph.append("path")
                    .datum(mpg_data) 
                    .attr("fill", "none")
                    .attr("stroke", "currentColor")
                    .attr("stroke-width", 1.5)
                    .attr("transform", "translate("+margin+","+margin+")")
                    .attr("d", lineGenerator);

                console.log("4. Initial mpg chart");

                mpg_graph.append('g')
                    .attr("transform", "translate(" + margin + "," + margin + ")")
                    .call(d3.axisLeft(yScale));

                mpg_graph.append('g')
                    .attr("transform", "translate(" + margin + "," + (height + margin) + ")")
                    .call(d3.axisBottom(xScale))
                    .selectAll("text")
                    .attr("transform", "rotate(-45)")
                    .style("text-anchor", "end");

                // Stacked Barchart Graph

                const body_graph = d3.select('#body_type_chart')
                    .append('svg')
                    .attr("width", width + margin * 2)
                    .attr("height", height + margin * 2);
                //proportion
                //proportion
                const series = d3.stack()
                    .keys(d3.union(body_type_data.map(d => d.veh_class)))
                    .value(([, group], key) => group.get(key)?.proportion || 0)
                   (d3.index(body_type_data, d => d.Year, d => d.veh_class));

                console.log("5. series initiated")

                body_graph.append("g")
                    .selectAll("g")
                    .data(series)
                    .join("g")
                        .attr("fill", d => color(d.key))
                    .selectAll("rect")
                    .data(D => D)
                    .join("rect")
                        .attr("x", d => x(d.data[0]))
                        .attr("y", d => y(d[1]))
                        .attr("height", d => y(d[0]) - y(d[1]))
                        .attr("width", x.bandwidth());

                console.log("6. Second graph initialized")
                
            }
        </script>
    </body>
</html>
